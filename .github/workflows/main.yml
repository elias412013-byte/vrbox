name: Build IPA
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Instalar XcodeGen
        run: brew install xcodegen
      - name: Generar proyecto
        run: xcodegen generate
      - name: Compilar
        run: |
          xcodebuild -project VRBox.xcodeproj -scheme VRBox \
            -sdk iphoneos -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Crear IPA
        run: |
          mkdir Payload
          cp -r build/Build/Products/Release-iphoneos/VRBox.app Payload/
          zip -r VRBox.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: VRBox-ipa
          path: VRBox.ipa
